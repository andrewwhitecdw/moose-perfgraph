[package]
name = "moose-perfgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rank MOOSE PerfGraph console sections by self and total time"
license = "MIT"
repository = "https://github.com/andrewwhitecdw/moose-perfgraph"
keywords = ["moose", "performance", "profiling", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
